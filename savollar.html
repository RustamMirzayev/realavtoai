<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savollar — Real Avto Qorako'l</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #EDEEF0;
    color: #1C1E22;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #5B6470; font-size: 14px; margin: 0 0 24px; }

  #login {
    background: #fff; border: 1px solid rgba(28,30,34,0.14);
    border-radius: 12px; padding: 20px; display: flex; gap: 10px; flex-wrap: wrap;
  }
  #login input {
    flex: 1; min-width: 180px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid rgba(28,30,34,0.2); font-size: 14px;
  }
  #login button, #refresh {
    background: #1F7A4D; color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #login button:hover, #refresh:hover { background: #175C3A; }
  #status { margin-top: 12px; font-size: 13.5px; color: #B3311C; }

  #panel { display: none; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .count { font-size: 13.5px; color: #5B6470; }

  .item {
    background: #fff; border: 1px solid rgba(28,30,34,0.14);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  }
  .item .time { font-size: 12px; color: #5B6470; margin-bottom: 8px; }
  .item .q { font-size: 14.5px; margin: 0 0 8px; }
  .item .q b { color: #1F7A4D; }
  .item .a { font-size: 14px; color: #333; background: #F6F3E9; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }
  .item .a b { color: #7a5c00; }
  .empty { color: #5B6470; font-size: 14px; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Yozilgan savollar</h1>
  <p class="sub">Mijozlar AI yordamchiga yozgan savollar va berilgan javoblar.</p>

  <div id="login">
    <input id="pw" type="password" placeholder="Parolni kiriting" autocomplete="off">
    <button onclick="load()">Kirish</button>
  </div>
  <div id="status"></div>

  <div id="panel">
    <div class="toolbar">
      <span class="count" id="count"></span>
      <button id="refresh" onclick="load()">Yangilash</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
  function fmtTime(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString("uz-UZ", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch { return iso; }
  }

  async function load() {
    const pw = document.getElementById("pw").value.trim();
    const statusEl = document.getElementById("status");
    if (!pw) { statusEl.textContent = "Parolni kiriting."; return; }
    statusEl.textContent = "Yuklanmoqda...";
    try {
      const res = await fetch("/api/savollar?password=" + encodeURIComponent(pw));
      const data = await res.json();
      if (res.status === 401) { statusEl.textContent = "Parol noto'g'ri."; return; }
      if (!res.ok) { statusEl.textContent = "Xatolik: " + (data.error || res.status); return; }

      statusEl.textContent = "";
      document.getElementById("login").style.display = "none";
      document.getElementById("panel").style.display = "block";
      try { sessionStorage.setItem("ra_pw", pw); } catch (e) {}

      if (!data.enabled) {
        document.getElementById("count").textContent = "";
        document.getElementById("list").innerHTML =
          '<div class="empty">Saqlash hali ulanmagan. UPSTASH_REDIS_REST_URL va UPSTASH_REDIS_REST_TOKEN environment variable&#39;larini qo&#39;shing.</div>';
        return;
      }

      document.getElementById("count").textContent = data.items.length + " ta yozuv";
      if (!data.items.length) {
        document.getElementById("list").innerHTML = '<div class="empty">Hali savol yozilmagan.</div>';
        return;
      }
      document.getElementById("list").innerHTML = data.items.map(it => `
        <div class="item">
          <div class="time">${fmtTime(it.t)}</div>
          <div class="q"><b>Savol:</b> ${escapeHtml(it.q || "")}</div>
          <div class="a"><b>Javob:</b> ${escapeHtml(it.a || "")}</div>
        </div>
      `).join("");
    } catch (err) {
      statusEl.textContent = "Server bilan aloqa yo'q.";
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  try {
    const saved = sessionStorage.getItem("ra_pw");
    if (saved) { document.getElementById("pw").value = saved; load(); }
  } catch (e) {}
</script>
</body>
</html>
